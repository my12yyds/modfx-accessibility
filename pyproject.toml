[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modfx-accessibility"
version = "0.1.0"
description = "A draft manifest and validator for accessibility controls on Minecraft mod visual effects"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "my12yyds" }]
keywords = ["minecraft", "accessibility", "mods", "visual-effects", "validator"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
modfx-a11y = "modfx_accessibility.cli:main"

[project.urls]
Homepage = "https://github.com/my12yyds/modfx-accessibility"
Issues = "https://github.com/my12yyds/modfx-accessibility/issues"
Source = "https://github.com/my12yyds/modfx-accessibility"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
